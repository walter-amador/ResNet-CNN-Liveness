<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Liveness Detection — Browser Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 20px; }

    #container {
      position: relative;
      width: 640px;
      max-width: 100%;
    }

    video, canvas {
      width: 100%;
      border-radius: 8px;
      display: block;
    }
    video { background: #000; }

    /* Overlay canvas sits on top of video */
    #overlay {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
    }

    #status-bar {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #aaa;
    }

    #prediction-badge {
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
      padding: 10px 20px;
      border-radius: 8px;
      background: #222;
      letter-spacing: 0.05em;
      min-height: 52px;
    }

    .live  { color: #22dd55; }
    .spoof { color: #ff3333; }
    .none  { color: #888; }

    button {
      margin-top: 16px;
      padding: 10px 28px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
      transition: background 0.2s;
    }
    button:hover  { background: #1d4ed8; }
    button:disabled { background: #444; cursor: default; }

    #log {
      margin-top: 16px;
      width: 640px;
      max-width: 100%;
      background: #1a1a1a;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 0.78rem;
      color: #777;
      font-family: monospace;
      max-height: 120px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<h1>Face Liveness Detection</h1>
<p class="subtitle">ResNet-18 · ONNX Runtime Web · Real-time inference</p>

<div id="container">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<div id="status-bar">
  <span id="fps-display">FPS: —</span>
  <span id="model-info">Loading model…</span>
</div>

<div id="prediction-badge" class="none">—</div>

<button id="start-btn" onclick="startDemo()">Start Webcam</button>

<div id="log"></div>

<!-- ONNX Runtime Web — load from CDN or local ort.min.js -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<script src="demo.js"></script>

</body>
</html>
