# Experiment 1 — ResNet-18 baseline
# Baseline model for the anti-spoofing classifier.
# This is the primary model; all other experiments are compared against it.

run_name: resnet18_full_run1
model_name: resnet18
pretrained: true

# Training
epochs: 30
batch_size: 32
lr: 0.0001
weight_decay: 0.0001
patience: 5

# Data
# subset_fraction defaults to 0.1 locally, 1.0 in Colab (auto-detected)
image_size: 224

# Augmentation
use_horizontal_flip: true
use_brightness_jitter: true
use_blur: true

# Face detector
face_detector: mediapipe
face_detector_confidence: 0.7
face_padding_frac: 0.10
