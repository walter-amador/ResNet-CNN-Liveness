# Experiment 1 — ResNet-50
# Largest ResNet variant; measure accuracy ceiling vs. latency cost.

run_name: resnet50_full_run1
model_name: resnet50
pretrained: true

epochs: 30
batch_size: 16      # smaller batch due to larger model
lr: 0.00005         # lower LR for larger model
weight_decay: 0.0001
patience: 5

image_size: 224

use_horizontal_flip: true
use_brightness_jitter: true
use_blur: true

face_detector: mediapipe
face_detector_confidence: 0.7
face_padding_frac: 0.10
