# Experiment 5 — YOLO11n-cls (nano classification)
# Lightweight YOLO classification model.
# Compared against ResNet for accuracy, FPS, and deployment efficiency.

run_name: yolo11n_cls_run1
model_name: yolo11n-cls

epochs: 30
batch_size: 32
lr: 0.0001         # Ultralytics may override; used for logging
weight_decay: 0.0001
patience: 5

image_size: 224

face_detector: mediapipe
face_detector_confidence: 0.7
face_padding_frac: 0.10
