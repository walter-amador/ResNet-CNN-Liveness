# Experiment 1 — ResNet-34
# Deeper backbone; compare accuracy gain vs. FPS cost vs. ResNet-18.

run_name: resnet34_full_run1
model_name: resnet34
pretrained: true

epochs: 30
batch_size: 32
lr: 0.0001
weight_decay: 0.0001
patience: 5

image_size: 224

use_horizontal_flip: true
use_brightness_jitter: true
use_blur: true

face_detector: mediapipe
face_detector_confidence: 0.7
face_padding_frac: 0.10
